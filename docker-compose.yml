services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" ||
          /opt/mssql-tools/bin/sqlcmd -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30
    environment:
      MP_DATABASE: "/data/mailpit.db"
      MP_MAX_MESSAGES: "500"
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    volumes:
      - mailpit-data:/data
    restart: unless-stopped

  api:
    image: quan-ly-nha-hang-api:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      Hosting__DisableHttpsRedirection: "true"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "http://localhost:5174"
      Cors__AllowedOrigins__2: "http://localhost:4173"
      Cors__AllowedOrigins__3: "http://localhost:4174"
      Database__ApplyMigrationsOnStartup: "true"
      Database__SyncPermissionCatalogOnStartup: "true"
      ConnectionStrings__DefaultConnection: >-
        Server=database,1433;Database=QuanLyNhaHang;
        User Id=sa;Password=${MSSQL_SA_PASSWORD};
        Encrypt=True;TrustServerCertificate=True
      Jwt__SecretKey: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}"
      Jwt__Issuer: "${JWT_ISSUER:-QuanLyNhaHang}"
      Jwt__Audience: "${JWT_AUDIENCE:-QuanLyNhaHang.Client}"
      Jwt__ExpiresInMinutes: "${JWT_EXPIRES_IN_MINUTES:-60}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      Email__SmtpHost: "${EMAIL_SMTP_HOST:-mailpit}"
      Email__SmtpPort: "${EMAIL_SMTP_PORT:-1025}"
      Email__EnableSsl: "${EMAIL_ENABLE_SSL:-false}"
      Email__UseAuthentication: "${EMAIL_USE_AUTHENTICATION:-false}"
      Email__Username: "${EMAIL_USERNAME:-}"
      Email__Password: "${EMAIL_PASSWORD:-}"
      Email__From: "${EMAIL_FROM:-noreply@quanlynhahang.local}"
      SePay__BankCode: "${SEPAY_BANK_CODE:-TPBank}"
      SePay__AccountNumber: "${SEPAY_ACCOUNT_NUMBER:-}"
      SePay__AccountHolder: "${SEPAY_ACCOUNT_HOLDER:-}"
      SePay__WebhookApiKey: "${SEPAY_WEBHOOK_API_KEY:-}"
      SePay__PaymentPrefix: "${SEPAY_PAYMENT_PREFIX:-DH}"
      SePay__RequireWebhookReadiness: "${SEPAY_REQUIRE_WEBHOOK_READINESS:-true}"
      SePay__WebhookHeartbeatTimeoutSeconds: "${SEPAY_WEBHOOK_HEARTBEAT_TIMEOUT_SECONDS:-35}"
    expose:
      - "8080"
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
    init: true
    restart: unless-stopped

  api-gateway:
    image: haproxy:3.0-alpine
    volumes:
      - ./docker/api-gateway.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof haproxy >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  admin-web:
    image: quan-ly-nha-hang-admin-web:local
    build:
      context: ./QuanLyNhaHang.Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_CUSTOMER_APP_URL: "http://localhost:4174"
    ports:
      - "4173:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

  customer-web:
    image: quan-ly-nha-hang-customer-web:local
    build:
      context: ./QuanLyNhaHang.CustomerWeb
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "4174:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver-data:
  mailpit-data:
