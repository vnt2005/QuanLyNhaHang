global
    log stdout format raw local0


defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 1s
    timeout client 120s
    timeout server 120s
    timeout tunnel 1h

resolvers docker_dns
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s
    hold valid 5s
    hold obsolete 10s

frontend local_api
    bind *:80

    acl is_gateway_health path -i /gateway-health
    http-request return status 200 content-type text/plain string ok if is_gateway_health

    default_backend restaurant_api

backend restaurant_api
    option httpchk GET /health/live
    http-check expect status 200

    # Ưu tiên API Visual Studio khi debug đang thực sự healthy.
    # Khi Visual Studio tắt, toàn bộ traffic tự chuyển sang Docker API.
    server visual-studio host.docker.internal:18080 check inter 500ms fall 1 rise 1 on-marked-down shutdown-sessions on-marked-up shutdown-backup-sessions

    # Docker API được resolve lại qua DNS nội bộ Docker để gateway không giữ
    # IP container cũ sau docker compose up --build / recreate.
    server docker-api api:8080 check inter 1s fall 1 rise 1 backup resolvers docker_dns resolve-prefer ipv4 init-addr libc,none
