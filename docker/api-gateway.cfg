global
    log stdout format raw local0


defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 1s
    timeout client 120s
    timeout server 120s
    timeout tunnel 1h

frontend local_api
    bind *:80

    acl is_gateway_health path -i /gateway-health
    http-request return status 200 content-type text/plain string ok if is_gateway_health

    default_backend restaurant_api

backend restaurant_api
    option httpchk GET /health/live
    http-check expect status 200

    # Active health check: chỉ dùng Visual Studio khi API debug thực sự healthy.
    # Nếu Visual Studio tắt, request đi thẳng Docker API mà không tạo 502 thử trước.
    # Khi backend active thay đổi, đóng connection cũ để SignalR tự reconnect vào
    # cùng backend mà các request HTTP mới đang sử dụng.
    server visual-studio host.docker.internal:18080 check inter 500ms fall 1 rise 1 on-marked-down shutdown-sessions on-marked-up shutdown-backup-sessions
    server docker-api api:8080 check inter 1s fall 1 rise 1 backup
