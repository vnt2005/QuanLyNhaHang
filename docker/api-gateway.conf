upstream restaurant_api {
    # Khi Visual Studio đang debug, ưu tiên API debug trên máy host.
    # Nếu Visual Studio không chạy, Nginx tự fallback sang API Docker.
    server host.docker.internal:18080 max_fails=1 fail_timeout=1s;
    server api:8080 backup;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    location = /gateway-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        proxy_pass http://restaurant_api;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 1s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Cho phép cả POST/PUT/PATCH tự chuyển sang API Docker nếu debug API
        # chưa chạy hoặc vừa dừng trước khi request hoàn tất kết nối.
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;
    }
}
