upstream restaurant_api {
    # API nghiệp vụ ưu tiên Visual Studio khi đang debug.
    # Nếu Visual Studio không chạy, Nginx tự fallback sang API Docker.
    server host.docker.internal:18080 max_fails=1 fail_timeout=5s;
    server api:8080 backup;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    location = /gateway-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Auth phải ổn định và không được phụ thuộc vào việc Visual Studio vừa
    # bật/tắt. Login/refresh/logout luôn đi thẳng API Docker đang chạy sẵn.
    # Các backend dùng chung DB/JWT nên token này vẫn hợp lệ khi request nghiệp
    # vụ sau đó được gateway chuyển sang Visual Studio debug.
    location ^~ /api/auth/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://restaurant_api;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 1s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Cho phép request nghiệp vụ tự chuyển sang API Docker nếu debug API
        # chưa chạy hoặc vừa dừng trước khi kết nối hoàn tất.
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;
    }
}
