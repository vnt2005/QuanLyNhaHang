<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fdfcf9" />
    <script>
      (() => {
        const storageKey = 'qlnh-customer-theme'
        let theme = null
        try { theme = window.localStorage.getItem(storageKey) } catch { /* Storage can be blocked. */ }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        const root = document.documentElement
        root.classList.toggle('dark', theme === 'dark')
        root.dataset.theme = theme
        root.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#171411' : '#fdfcf9')
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Website dành cho khách hàng: xem thực đơn, đặt bàn và theo dõi đơn tại nhà hàng."
    />
    <title>Nhà Hàng</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
