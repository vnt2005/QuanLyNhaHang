server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker DNS phải được resolve động vì api-gateway có thể được recreate
  # trong lúc phát triển. Dùng biến ở proxy_pass để Nginx không giữ IP cũ.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_gateway api-gateway:80;

  # Browser chỉ gọi same-origin 4174. Nginx chuyển toàn bộ API qua đúng một
  # gateway nội bộ Docker; $request_uri giữ nguyên path + query string.
  location /api/ {
    proxy_pass http://$api_gateway$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  location /hubs/ {
    proxy_pass http://$api_gateway$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
