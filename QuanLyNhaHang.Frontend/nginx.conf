server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Auth luôn đi thẳng Docker API ổn định. Browser chỉ gọi cùng origin 4173,
  # vì vậy không phát sinh CORS/preflight giữa frontend và API Gateway.
  location ^~ /api/auth/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  # Các API nghiệp vụ đi qua gateway chung để vẫn có thể ưu tiên Visual Studio
  # debug API và fallback Docker API.
  location /api/ {
    proxy_pass http://api-gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  location /hubs/ {
    proxy_pass http://api-gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 2s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
