<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f6fa" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Quản Lý Nhà Hàng</title>
    <script>
      (() => {
        const storageKey = 'qlnh-admin-theme'
        let theme = null
        try { theme = window.localStorage.getItem(storageKey) } catch { /* Storage can be blocked. */ }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        const root = document.documentElement
        root.dataset.adminTheme = theme
        root.classList.toggle('dark', theme === 'dark')
        root.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          'content',
          theme === 'dark' ? '#07111f' : '#f3f6fa',
        )
      })()
    </script>
    <link rel="stylesheet" href="/src/styles/index.css" />
    <link id="admin-dark-theme" rel="stylesheet" href="/src/styles/theme-dark.css" disabled />
    <script>
      document.getElementById('admin-dark-theme').disabled =
        document.documentElement.dataset.adminTheme !== 'dark'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
