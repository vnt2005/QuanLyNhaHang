name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'QuanLyNhaHang.Frontend/**'
      - 'QuanLyNhaHang.CustomerWeb/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'QuanLyNhaHang.Frontend/**'
      - 'QuanLyNhaHang.CustomerWeb/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install, audit and build (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        project:
          - QuanLyNhaHang.Frontend
          - QuanLyNhaHang.CustomerWeb

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        run: npm run build