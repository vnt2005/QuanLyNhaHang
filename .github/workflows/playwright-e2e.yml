name: Playwright E2E

on:
  push:
    branches:
      - main
    paths:
      - 'QuanLyNhaHang.Api/**'
      - 'QuanLyNhaHang.Application/**'
      - 'QuanLyNhaHang.Domain/**'
      - 'QuanLyNhaHang.Infrastructure/**'
      - 'QuanLyNhaHang.Frontend/**'
      - 'QuanLyNhaHang.E2ETests/**'
      - '.github/scripts/seed-e2e-admin.sql'
      - '.github/workflows/playwright-e2e.yml'
      - 'Dockerfile'
      - 'docker-compose.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'QuanLyNhaHang.Api/**'
      - 'QuanLyNhaHang.Application/**'
      - 'QuanLyNhaHang.Domain/**'
      - 'QuanLyNhaHang.Infrastructure/**'
      - 'QuanLyNhaHang.Frontend/**'
      - 'QuanLyNhaHang.E2ETests/**'
      - '.github/scripts/seed-e2e-admin.sql'
      - '.github/workflows/playwright-e2e.yml'
      - 'Dockerfile'
      - 'docker-compose.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MSSQL_SA_PASSWORD: 'Playwright-Sql-2026!Aa1'
  JWT_SECRET_KEY: 'Playwright-E2E-Jwt-Secret-Key-2026-QuanLyNhaHang'
  JWT_ISSUER: 'QuanLyNhaHang.E2E'
  JWT_AUDIENCE: 'QuanLyNhaHang.E2E.Client'
  FRONTEND_ORIGIN: 'http://127.0.0.1:5173'
  API_PORT: '8080'
  VITE_API_BASE_URL: 'http://127.0.0.1:8080'
  E2E_API_URL: 'http://127.0.0.1:8080'
  E2E_BASE_URL: 'http://127.0.0.1:5173'
  E2E_ADMIN_EMAIL: 'playwright-admin@quanlynhahang.local'
  E2E_ADMIN_PASSWORD: 'Playwright-Admin-2026!Aa1'

jobs:
  e2e:
    name: Chromium full-stack workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Install frontend dependencies
        working-directory: QuanLyNhaHang.Frontend
        run: npm ci

      - name: Install Playwright dependencies
        working-directory: QuanLyNhaHang.E2ETests
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: QuanLyNhaHang.E2ETests
        run: npx playwright install --with-deps chromium

      - name: Prepare Docker environment
        run: |
          cat > .env <<EOF
          MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
          JWT_SECRET_KEY=${JWT_SECRET_KEY}
          JWT_ISSUER=${JWT_ISSUER}
          JWT_AUDIENCE=${JWT_AUDIENCE}
          FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
          API_PORT=${API_PORT}
          EMAIL_SMTP_HOST=mailpit
          EMAIL_SMTP_PORT=1025
          EMAIL_ENABLE_SSL=false
          EMAIL_USE_AUTHENTICATION=false
          EOF

      - name: Start database, mail and API
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d --build database mailpit api

      - name: Wait for API health
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error "${E2E_API_URL}/health" > /dev/null; then
              echo "API is healthy."
              exit 0
            fi
            echo "Waiting for API (${attempt}/60)..."
            sleep 3
          done

          docker compose logs --no-color
          exit 1

      - name: Create E2E Admin account
        run: |
          register_status=$(curl --silent --show-error \
            --output /tmp/e2e-register.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "{\"ho\":\"Playwright\",\"ten\":\"Admin\",\"email\":\"${E2E_ADMIN_EMAIL}\",\"phoneNumber\":\"0900000001\",\"password\":\"${E2E_ADMIN_PASSWORD}\"}" \
            "${E2E_API_URL}/api/auth/register")

          cat /tmp/e2e-register.json
          test "${register_status}" = '200'

          if docker compose exec -T database /opt/mssql-tools18/bin/sqlcmd -? > /dev/null 2>&1; then
            sqlcmd_path='/opt/mssql-tools18/bin/sqlcmd'
          else
            sqlcmd_path='/opt/mssql-tools/bin/sqlcmd'
          fi

          cat .github/scripts/seed-e2e-admin.sql | docker compose exec -T database \
            "${sqlcmd_path}" \
            -S localhost \
            -U sa \
            -P "${MSSQL_SA_PASSWORD}" \
            -C \
            -d QuanLyNhaHang \
            -b \
            -v AdminEmail="${E2E_ADMIN_EMAIL}" \
            -i /dev/stdin

      - name: Verify E2E Admin login
        run: |
          login_status=$(curl --silent --show-error \
            --output /tmp/e2e-login.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "{\"email\":\"${E2E_ADMIN_EMAIL}\",\"password\":\"${E2E_ADMIN_PASSWORD}\"}" \
            "${E2E_API_URL}/api/auth/login")

          cat /tmp/e2e-login.json
          test "${login_status}" = '200'

      - name: Run Playwright tests
        working-directory: QuanLyNhaHang.E2ETests
        run: npm test

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            QuanLyNhaHang.E2ETests/playwright-report
            QuanLyNhaHang.E2ETests/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop full-stack services
        if: always()
        run: docker compose down -v --remove-orphans
