name: Synchronize Gemini model defaults

on:
  push:
    branches:
      - feat/customer-ai-assistant-admin

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/customer-ai-assistant-admin
          fetch-depth: 0

      - name: Replace legacy OpenAI model defaults
        shell: python
        run: |
          from pathlib import Path

          paths = [
              Path('QuanLyNhaHang.Domain/Entities/RestaurantSetting.cs'),
              Path('QuanLyNhaHang.Infrastructure/Configurations/RestaurantSettingConfiguration.cs'),
              Path('QuanLyNhaHang.Infrastructure/Migrations/20260901111000_AddCustomerAiAssistant.cs'),
              Path('QuanLyNhaHang.Infrastructure/Migrations/ApplicationDbContextModelSnapshot.cs'),
          ]

          total = 0
          for path in paths:
              text = path.read_text(encoding='utf-8-sig')
              count = text.count('gpt-5.6-luna')
              if count == 0:
                  print(f'{path}: already synchronized')
                  continue
              path.write_text(text.replace('gpt-5.6-luna', 'gemini-3.7-flash'), encoding='utf-8-sig')
              print(f'{path}: replaced {count} occurrence(s)')
              total += count

          if total == 0:
              print('No legacy model defaults remained.')

      - name: Commit synchronized defaults and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/zz-switch-gemini-default.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add QuanLyNhaHang.Domain/Entities/RestaurantSetting.cs \
                  QuanLyNhaHang.Infrastructure/Configurations/RestaurantSettingConfiguration.cs \
                  QuanLyNhaHang.Infrastructure/Migrations/20260901111000_AddCustomerAiAssistant.cs \
                  QuanLyNhaHang.Infrastructure/Migrations/ApplicationDbContextModelSnapshot.cs \
                  .github/workflows/zz-switch-gemini-default.yml
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'fix: use Gemini as AI assistant default model'
          git push origin HEAD:feat/customer-ai-assistant-admin
