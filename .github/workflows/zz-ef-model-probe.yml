name: Diagnose EF model drift

on:
  push:
    branches:
      - feat/customer-ai-assistant-admin

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install EF Core CLI
        run: dotnet tool install --tool-path ./.tools dotnet-ef --version 10.0.10

      - name: Generate diagnostic migration
        shell: bash
        env:
          ConnectionStrings__DefaultConnection: 'Server=localhost;Database=QuanLyNhaHang;User Id=sa;Password=ProbeOnly_StrongPassword_123!;Encrypt=True;TrustServerCertificate=True'
        run: |
          set -euo pipefail
          ./.tools/dotnet-ef migrations add __PendingModelProbe \
            --project QuanLyNhaHang.Infrastructure/QuanLyNhaHang.Infrastructure.csproj \
            --startup-project QuanLyNhaHang.Api/QuanLyNhaHang.Api.csproj \
            --output-dir Migrations/__PendingModelProbe

          echo '===== SNAPSHOT DIFF ====='
          git --no-pager diff -- QuanLyNhaHang.Infrastructure/Migrations/ApplicationDbContextModelSnapshot.cs

          echo '===== GENERATED PROBE MIGRATION ====='
          find QuanLyNhaHang.Infrastructure/Migrations/__PendingModelProbe -type f -name '*__PendingModelProbe.cs' -print -exec cat {} \;

          echo '===== GENERATED PROBE DESIGNER ====='
          find QuanLyNhaHang.Infrastructure/Migrations/__PendingModelProbe -type f -name '*__PendingModelProbe.Designer.cs' -print -exec cat {} \;
