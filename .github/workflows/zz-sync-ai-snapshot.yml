name: Sync AI migration snapshot

on:
  push:
    branches:
      - feat/customer-ai-assistant-admin

permissions:
  contents: write

jobs:
  sync-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/customer-ai-assistant-admin
          fetch-depth: 0

      - name: Update EF Core model snapshot
        shell: python
        run: |
          from pathlib import Path

          path = Path("QuanLyNhaHang.Infrastructure/Migrations/ApplicationDbContextModelSnapshot.cs")
          text = path.read_text(encoding="utf-8-sig")

          entity_start_marker = 'modelBuilder.Entity("QuanLyNhaHang.Domain.Entities.RestaurantSetting", b =>'
          entity_end_marker = 'modelBuilder.Entity("QuanLyNhaHang.Domain.Entities.RestaurantTable", b =>'
          start = text.index(entity_start_marker)
          end = text.index(entity_end_marker, start)
          section = text[start:end]

          closing_marker = '                    b.Property<string>("ClosingTime")'
          ai_properties = '''                    b.Property<bool>("AiAssistantEnabled")
                        .ValueGeneratedOnAdd()
                        .HasColumnType("bit")
                        .HasDefaultValue(false);

                    b.Property<string>("AiAssistantKnowledgeBase")
                        .HasColumnType("nvarchar(max)");

                    b.Property<int>("AiAssistantMaxOutputTokens")
                        .ValueGeneratedOnAdd()
                        .HasColumnType("int")
                        .HasDefaultValue(500);

                    b.Property<string>("AiAssistantModel")
                        .IsRequired()
                        .ValueGeneratedOnAdd()
                        .HasMaxLength(100)
                        .HasColumnType("nvarchar(100)")
                        .HasDefaultValue("gpt-5.6-luna");

                    b.Property<string>("AiAssistantSuggestedQuestions")
                        .HasMaxLength(4000)
                        .HasColumnType("nvarchar(4000)");

                    b.Property<string>("AiAssistantSystemPrompt")
                        .HasMaxLength(8000)
                        .HasColumnType("nvarchar(8000)");

                    b.Property<string>("AiAssistantWelcomeMessage")
                        .HasMaxLength(1000)
                        .HasColumnType("nvarchar(1000)");

'''

          if 'b.Property<bool>("AiAssistantEnabled")' not in section:
              if closing_marker not in section:
                  raise SystemExit("RestaurantSetting ClosingTime marker not found")
              section = section.replace(closing_marker, ai_properties + closing_marker, 1)
              text = text[:start] + section + text[end:]
              path.write_text(text, encoding="utf-8-sig")

          temporary_partial = Path(
              "QuanLyNhaHang.Infrastructure/Migrations/ApplicationDbContextModelSnapshot.AiAssistant.cs"
          )
          if temporary_partial.exists():
              temporary_partial.unlink()

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build backend
        run: dotnet build QuanLyNhaHang.Api/QuanLyNhaHang.Api.csproj --configuration Release

      - name: Commit snapshot fix
        run: |
          if git diff --quiet; then
            echo "Snapshot already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A QuanLyNhaHang.Infrastructure/Migrations/ApplicationDbContextModelSnapshot.cs QuanLyNhaHang.Infrastructure/Migrations/ApplicationDbContextModelSnapshot.AiAssistant.cs
          git commit -m "fix: update EF snapshot for AI settings"
          git push origin HEAD:feat/customer-ai-assistant-admin
