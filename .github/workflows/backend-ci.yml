name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'QuanLyNhaHang.Api/**'
      - 'QuanLyNhaHang.Application/**'
      - 'QuanLyNhaHang.Domain/**'
      - 'QuanLyNhaHang.Infrastructure/**'
      - 'QuanLyNhaHang.UnitTests/**'
      - 'QuanLyNhaHang.IntegrationTests/**'
      - 'scripts/**'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'docker-compose.*.yml'
      - 'docker/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:
    inputs:
      run_docker:
        description: 'Build and smoke test the API Docker image'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Detect expensive validation scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUN_DOCKER: ${{ inputs.run_docker }}
        run: |
          scripts_changed=false
          compose_changed=false
          docker_changed=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            scripts_changed=true

            if [ "$RUN_DOCKER" = "true" ]; then
              compose_changed=true
              docker_changed=true
            fi
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            changed_files="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"

            if grep -qE '^scripts/.*\.ps1$' <<<"$changed_files"; then
              scripts_changed=true
            fi

            if grep -qE '^(docker-compose(\..+)?\.ya?ml|docker/)' <<<"$changed_files"; then
              compose_changed=true
            fi

            if grep -qE '^(Dockerfile|\.dockerignore)$' <<<"$changed_files"; then
              docker_changed=true
            fi
          fi

          echo "scripts_changed=$scripts_changed" >> "$GITHUB_OUTPUT"
          echo "compose_changed=$compose_changed" >> "$GITHUB_OUTPUT"
          echo "docker_changed=$docker_changed" >> "$GITHUB_OUTPUT"

      - name: Validate PowerShell script syntax
        if: steps.scope.outputs.scripts_changed == 'true'
        shell: pwsh
        run: |
          $hasErrors = $false

          Get-ChildItem -Path ./scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            foreach ($parseError in $parseErrors) {
              Write-Error "$($_.FullName): $($parseError.Message)"
              $hasErrors = $true
            }
          }

          if ($hasErrors) {
            exit 1
          }

      - name: Reject tracked local secret files
        shell: bash
        run: |
          tracked_local_secrets="$(
            git ls-files |
              grep -E '(^|/)(\.env($|\.)|appsettings(\.[^/]+)?\.json$)' |
              grep -vE '(^|/)\.env\.example$' || true
          )"

          if [ -n "$tracked_local_secrets" ]; then
            echo "::error::Local secret-bearing configuration files must not be committed."
            echo "$tracked_local_secrets"
            exit 1
          fi

          echo "No tracked .env or appsettings secret files were found."

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore test projects
        run: |
          dotnet restore QuanLyNhaHang.UnitTests/QuanLyNhaHang.UnitTests.csproj
          dotnet restore QuanLyNhaHang.IntegrationTests/QuanLyNhaHang.IntegrationTests.csproj

      - name: Run unit tests
        run: >-
          dotnet test QuanLyNhaHang.UnitTests/QuanLyNhaHang.UnitTests.csproj
          --configuration Release
          --no-restore
          --verbosity minimal

      - name: Run integration tests
        shell: bash
        run: |
          set -o pipefail
          dotnet test QuanLyNhaHang.IntegrationTests/QuanLyNhaHang.IntegrationTests.csproj \
            --configuration Release \
            --no-restore \
            --verbosity minimal \
            --logger "console;verbosity=normal" \
            2>&1 | tee integration-tests.log

      - name: Upload integration test log
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-log
          path: integration-tests.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Validate Docker Compose
        if: steps.scope.outputs.compose_changed == 'true' || steps.scope.outputs.docker_changed == 'true'
        env:
          MSSQL_SA_PASSWORD: "CiOnly_StrongPassword_123!"
          JWT_SECRET_KEY: "ci-only-jwt-secret-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ"
        run: docker compose config --quiet

      - name: Build Docker image
        if: steps.scope.outputs.docker_changed == 'true'
        run: docker build --tag quan-ly-nha-hang-api:ci .

      - name: Smoke test Docker container
        if: steps.scope.outputs.docker_changed == 'true'
        shell: bash
        env:
          JWT_SECRET_KEY: "ci-only-jwt-secret-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ"
        run: |
          docker run --detach --name quan-ly-nha-hang-api-ci \
            --publish 8080:8080 \
            --env ASPNETCORE_ENVIRONMENT=Production \
            --env ASPNETCORE_HTTP_PORTS=8080 \
            --env Hosting__DisableHttpsRedirection=true \
            --env Database__ApplyMigrationsOnStartup=false \
            --env Database__SyncPermissionCatalogOnStartup=false \
            --env "ConnectionStrings__DefaultConnection=Server=localhost;Database=QuanLyNhaHang;User Id=sa;Password=CiOnly_StrongPassword_123!;Encrypt=True;TrustServerCertificate=True" \
            --env "Jwt__SecretKey=$JWT_SECRET_KEY" \
            --env Jwt__Issuer=QuanLyNhaHang \
            --env Jwt__Audience=QuanLyNhaHang.Client \
            quan-ly-nha-hang-api:ci

          cleanup() {
            docker logs quan-ly-nha-hang-api-ci || true
            docker rm --force quan-ly-nha-hang-api-ci || true
          }
          trap cleanup EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://localhost:8080/health; then
              exit 0
            fi

            if ! docker inspect --format '{{.State.Running}}' quan-ly-nha-hang-api-ci | grep --quiet true; then
              echo "::error::Docker container exited before becoming healthy."
              exit 1
            fi

            sleep 2
          done

          echo "::error::Docker container did not become healthy within 40 seconds."
          exit 1
