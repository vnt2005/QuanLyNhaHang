name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Restore, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        id: setup-dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Pin CI SDK
        run: >-
          dotnet new globaljson
          --sdk-version "${{ steps.setup-dotnet.outputs.dotnet-version }}"
          --roll-forward latestPatch
          --force

      - name: Show .NET information
        run: dotnet --info

      - name: Restore backend
        run: dotnet restore QuanLyNhaHang.Api/QuanLyNhaHang.Api.csproj

      - name: Build backend
        run: >-
          dotnet build QuanLyNhaHang.Api/QuanLyNhaHang.Api.csproj
          --configuration Release
          --no-restore

      - name: Run unit tests
        run: >-
          dotnet test QuanLyNhaHang.UnitTests/QuanLyNhaHang.UnitTests.csproj
          --configuration Release
          --verbosity minimal

      - name: Run refresh token session tests
        run: >-
          dotnet test QuanLyNhaHang.IntegrationTests/QuanLyNhaHang.IntegrationTests.csproj
          --configuration Release
          --filter FullyQualifiedName~RefreshTokenSessionTests
          --verbosity minimal

      - name: Run integration tests
        shell: bash
        run: |
          set +e
          dotnet test QuanLyNhaHang.IntegrationTests/QuanLyNhaHang.IntegrationTests.csproj \
            --configuration Release \
            --verbosity quiet \
            > integration-tests.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::group::Integration test failure summary"
            grep -E -A 12 -B 3 \
              'Failed |Error Message:|Stack Trace:|Test Run Failed|Total tests:' \
              integration-tests.log | tail -n 240 || true
            echo "::endgroup::"
            exit "$status"
          fi

          tail -n 20 integration-tests.log

      - name: Validate Docker Compose
        env:
          MSSQL_SA_PASSWORD: "CiOnly_StrongPassword_123!"
          JWT_SECRET_KEY: "ci-only-jwt-secret-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ"
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build --tag quan-ly-nha-hang-api:ci .

      - name: Smoke test Docker container
        shell: bash
        env:
          JWT_SECRET_KEY: "ci-only-jwt-secret-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ"
        run: |
          docker run --detach --name quan-ly-nha-hang-api-ci \
            --publish 8080:8080 \
            --env ASPNETCORE_ENVIRONMENT=Production \
            --env ASPNETCORE_HTTP_PORTS=8080 \
            --env Hosting__DisableHttpsRedirection=true \
            --env Database__ApplyMigrationsOnStartup=false \
            --env Database__SyncPermissionCatalogOnStartup=false \
            --env "ConnectionStrings__DefaultConnection=Server=localhost;Database=QuanLyNhaHang;User Id=sa;Password=CiOnly_StrongPassword_123!;Encrypt=True;TrustServerCertificate=True" \
            --env "Jwt__SecretKey=$JWT_SECRET_KEY" \
            --env Jwt__Issuer=QuanLyNhaHang \
            --env Jwt__Audience=QuanLyNhaHang.Client \
            quan-ly-nha-hang-api:ci

          cleanup() {
            docker logs quan-ly-nha-hang-api-ci || true
            docker rm --force quan-ly-nha-hang-api-ci || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8080/health; then
              exit 0
            fi

            if ! docker inspect --format '{{.State.Running}}' quan-ly-nha-hang-api-ci | grep --quiet true; then
              echo "::error::Docker container exited before becoming healthy."
              exit 1
            fi

            sleep 2
          done

          echo "::error::Docker container did not become healthy within 60 seconds."
          exit 1
