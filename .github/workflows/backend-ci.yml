name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Restore, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        id: setup-dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Pin CI SDK
        run: >-
          dotnet new globaljson
          --sdk-version "${{ steps.setup-dotnet.outputs.dotnet-version }}"
          --roll-forward latestPatch
          --force

      - name: Show .NET information
        run: dotnet --info

      - name: Restore backend
        run: dotnet restore QuanLyNhaHang.Api/QuanLyNhaHang.Api.csproj

      - name: Build backend
        run: >-
          dotnet build QuanLyNhaHang.Api/QuanLyNhaHang.Api.csproj
          --configuration Release
          --no-restore

      - name: Run tests when present
        shell: bash
        run: |
          mapfile -t test_projects < <(
            find . -type f \( -name '*Tests.csproj' -o -name '*Test.csproj' \) -print |
              sort
          )

          if [ "${#test_projects[@]}" -eq 0 ]; then
            echo "::error::No test projects were found."
            exit 1
          fi

          printf 'Discovered test project: %s\n' "${test_projects[@]}"

          for project in "${test_projects[@]}"; do
            dotnet test "$project" --configuration Release --verbosity normal
          done
